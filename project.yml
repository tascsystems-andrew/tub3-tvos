name: Tub3
options:
  bundleIdPrefix: com.tascsystems
  deploymentTarget:
    tvOS: "18.0"
    iOS: "18.0"
packages:
  Tub3Core:
    path: Core
settings:
  base:
    SWIFT_VERSION: "6.0"
    # The team is the certificate's OU, not the id in its common name. The CN reads
    # "Apple Development: andrew sanche (2X2JM87R7W)" and that parenthetical is the
    # certificate's own identifier — signing with it fails.
    DEVELOPMENT_TEAM: 32CZP96PT9
    CODE_SIGN_STYLE: Automatic
targets:
  Tub3TV:
    type: application
    platform: tvOS
    sources: [Shared, Apps/TV]
    dependencies:
      - package: Tub3Core
        product: Tub3Core
    info:
      path: Apps/TV/Info.plist
      properties:
        CFBundleDisplayName: 8008TUB3
        # The app has no encryption of its own — it fetches over plain HTTP from the box on
        # the local network. Declaring it here answers App Store Connect's export-compliance
        # question once, instead of on every build upload.
        ITSAppUsesNonExemptEncryption: false
        # Finding the box on the network. All three of these fail SILENTLY when absent, which
        # is why they are together with a note rather than scattered.
        #
        # Without NSBonjourServices the browser reports an empty network — no error, no
        # callback, no permission prompt. It looks exactly like having no box.
        NSBonjourServices: [_tub3._tcp]
        # The local-network permission prompt's text. Without it the prompt cannot be shown,
        # so permission is never granted, so browsing finds nothing — silently again.
        NSLocalNetworkUsageDescription: >-
          8008TUB3 looks for your box on this network so you do not have to type its address
          into a television.
        # A discovered service resolves to an address, not a name — measured: the box on this
        # network came back as http://10.0.1.116:8008 rather than boobtube.local. App
        # Transport Security blocks plain HTTP to an address literal, and the box speaks HTTP.
        # NSAllowsLocalNetworking permits exactly that and no more: local names and private
        # ranges. It is not NSAllowsArbitraryLoads, which would permit the whole internet.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        # Point the plist at the build settings rather than repeating the numbers. Without
        # these two lines Info.plist carried a literal "1" and MARKETING_VERSION /
        # CURRENT_PROJECT_VERSION were decoration — a bump would have changed nothing, and
        # the second upload of a build would have been rejected as a duplicate.
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tascsystems.tub3
        ASSETCATALOG_COMPILER_APPICON_NAME: "App Icon & Top Shelf Image"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "2"
  Tub3Phone:
    type: application
    platform: iOS
    sources: [Shared, Apps/Phone]
    dependencies:
      - package: Tub3Core
        product: Tub3Core
    info:
      path: Apps/Phone/Info.plist
      properties:
        CFBundleDisplayName: 8008TUB3
        UILaunchScreen: {}
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tascsystems.tub3
        TARGETED_DEVICE_FAMILY: "1,2"
  Tub3TVUITests:
    type: bundle.ui-testing
    platform: tvOS
    sources: [Tests/TVUITests]
    dependencies:
      - target: Tub3TV
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tascsystems.tub3.uitests
        TEST_TARGET_NAME: Tub3TV
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Tub3TV:
    build:
      targets:
        Tub3TV: all
        Tub3TVUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets: [Tub3TVUITests]
      # What the gate leaves out lives in the Makefile, not here, and that is deliberate.
      #
      # This used to say `skippedTests: [Tub3TVUITests/ParkTests]` as a sibling of `targets`,
      # where XcodeGen silently drops it — no warning, no `<SkippedTests>` in the generated
      # scheme — so the photography aids had been running in every `make uitest` since the
      # day that line was written, and one of them duly turned up in a flaky-run report as a
      # failure of a test the scheme claimed to skip.
      #
      # Written correctly it does generate, and then it is worse: measured, `-only-testing`
      # does **not** outrank a scheme skip. `xcodebuild ... -only-testing:.../ParkTests`
      # against a scheme that skips it runs zero tests and exits 0 — so `make uiprobe` and
      # the by-name screenshot park would both have quietly done nothing, which is the same
      # silent no-op one layer down. `-skip-testing` on the gate's own command line has
      # neither problem and can be read off the line that runs.
    # Archive must be Release, or automatic signing reaches for a *development* profile —
    # which needs a registered device and is the wrong kind of profile for TestFlight.
    archive:
      config: Release
